<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
        color: white;
        text-align: center;
    }

    .card {
        width: 90%;
        max-width: 420px;
        padding: 35px 20px;
        border-radius: 25px;
        background: rgba(255,255,255,0.18);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        position: relative;
        z-index: 2;
    }

    .emoji {
        font-size: 65px;
        animation: bounce 1.5s infinite;
    }

    h1 {
        font-size: 42px;
        margin: 15px 0;
        text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    h2 {
        font-size: 27px;
        margin-bottom: 15px;
    }

    p {
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    button {
        border: none;
        padding: 13px 25px;
        border-radius: 30px;
        background: white;
        color: #e75480;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        animation: fall linear forwards;
        z-index: 5;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
        }
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-15px);
        }
    }

    .cake {
        font-size: 55px;
        margin: 10px;
    }

    @media (max-width: 400px) {
        h1 {
            font-size: 34px;
        }

        h2 {
            font-size: 23px;
        }

        p {
            font-size: 15px;
        }

        .card {
            padding: 28px 17px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <div class="emoji">🎉</div>

    <h1>Happy Birthday!</h1>

    <h2>🎂 Birthday girl 🎂</h2>

    <p>
        Wishing you a day filled with happiness, laughter,
        beautiful memories and lots of love! 💖
        May all your dreams come true and your year ahead
        be absolutely amazing! ✨
    </p>

    <div class="cake">🎂</div>

    <button onclick="celebrate()">🎊 Celebrate Again 🎊</button>
</div>

<script>
function createConfetti() {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");

    const colors = [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec",
        "#ffffff"
    ];

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

    confetti.style.width = Math.random() * 8 + 6 + "px";
    confetti.style.height = Math.random() * 8 + 6 + "px";

    confetti.style.animationDuration =
        Math.random() * 3 + 2 + "s";

    confetti.style.borderRadius =
        Math.random() > 0.5 ? "50%" : "0";

    document.body.appendChild(confetti);

    setTimeout(() => {
        confetti.remove();
    }, 5000);
}

function celebrate() {
    for (let i = 0; i < 120; i++) {
        setTimeout(createConfetti, i * 15);
    }
}

// Automatic confetti when the page opens
celebrate();
</script>

</body>
</html>
